name: Compt
description: Compt is an employee benefits platform that automates flexible stipends and Lifestyle
  Spending Accounts (LSAs). HR teams define eligible categories across 30+ benefit types — wellness,
  childcare, professional development, and more — while employees submit receipts for reimbursement.
  The platform automatically handles taxable versus nontaxable treatment and delivers payments through
  existing payroll, alongside rewards and recognition, professional development management, employee
  discounts, a company swag store, and business expense tracking. Compt reports a 93% average
  participation rate and roughly 30 minutes of monthly admin time. It is a Battery Ventures portfolio
  company. No public API or developer program was found during enrichment.
